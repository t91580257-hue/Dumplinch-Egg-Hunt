name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить пакеты Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Скачать Godot ${{ env.GODOT_VERSION }}
        run: |
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Установить шаблоны экспорта Godot
        run: |
          cd "$HOME/godot"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          cp -a templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Создать временный debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Настроить пути Android для Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Импортировать ресурсы проекта
        run: godot --headless --path . --editor --import --quit

      - name: Проверить скрипты и ресурсы
        run: godot --headless --path . --script res://scripts/tools/validate_project.gd

      - name: Дымовой тест главной сцены
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/tools/smoke_test.gd 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" smoke.log; then
            echo "Обнаружены ошибки Godot."
            exit 1
          fi

      - name: Собрать debug APK ARM64
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/debug.keystore"
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DumplinchEggHunt.apk
          test -s build/DumplinchEggHunt.apk

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: DumplinchEggHunt-Android-ARM64-debug
          path: build/DumplinchEggHunt.apk
          if-no-files-found: error
          retention-days: 14
